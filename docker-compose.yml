services:
  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: earning_lines
      POSTGRES_USER: alcor
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432" # for DB clients on the host only; the app connects via the "postgres" service
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alcor -d earning_lines"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
